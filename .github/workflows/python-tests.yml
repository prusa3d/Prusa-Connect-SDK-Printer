# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  pull-requests: write # to comment the coverage table on a pull request

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -U -r requirements.txt
        pip install -U types-requests
        pip install -U ruff pytest pytest-doctestplus pylint
        pip install -U requests_mock pytest-mypy func-timeout responses pytest-cov

    - name: Lint with ruff
      run: |
        ruff check .
    - name: Lint with pylint
      run: |
        pylint prusa/connect/printer
    - name: Type check and doctest
      run: |
        pytest -v --mypy --doctest-plus --doctest-rst prusa/connect/printer
    - name: Tests
      run: |
        TZ=Europe/Prague pytest -v --mypy tests --log-cli-level=10
    - name: Make the coverage table
      # One Python version is enough, the numbers are the same.
      if: matrix.python-version == '3.13'
      run: |
        {
          echo "### Test coverage of prusa.connect.printer"
          echo
          python -m coverage report --format=markdown --skip-empty
        } > coverage.md
        cat coverage.md >> "$GITHUB_STEP_SUMMARY"
    - name: Comment the table on the pull request
      # Not for pushes (there is no pull request) and not for forks (their
      # token cannot write); the summary of the run has the table anyway.
      if: >
        matrix.python-version == '3.13' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      env:
        GH_TOKEN: ${{ github.token }}
      run: >
        gh pr comment ${{ github.event.pull_request.number }}
        --edit-last --create-if-none --body-file coverage.md
    - name: Every file must be covered at least from 90 %
      if: matrix.python-version == '3.13'
      run: |
        min=90
        python -m coverage report --skip-empty | awk -v min="$min" '
          $1 ~ /^prusa\// {
            cover = $4; gsub("%", "", cover)
            if (cover + 0 < min) {
              printf "::error::%s is covered only from %s %% (minimum %s %%)\n", $1, cover, min
              failed = 1
            }
          }
          END { exit failed }'
